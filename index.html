// 터치해도 포커스(키보드)를 가져가지 않는 버튼 처리
function noFocusTap(el, fn){
  el.tabIndex=-1;
  let sx=0,sy=0,moved=false;
  el.addEventListener('touchstart',e=>{e.stopPropagation();const t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false;},{passive:true});
  el.addEventListener('touchmove',e=>{const t=e.touches[0];if(Math.abs(t.clientX-sx)>8||Math.abs(t.clientY-sy)>8)moved=true;},{passive:true});
  el.addEventListener('touchend',e=>{
    e.preventDefault();e.stopPropagation();
    if(moved) return;
    fn();
  },{passive:false});
  el.addEventListener('mousedown',e=>e.preventDefault());
}
// 표 안의 입력칸이 아닌 곳(제목줄, 소계, 합계, 카테고리 바 등)을 눌러도 키보드가 뜨지 않게
function isTypingTarget(t){
  return !!(t && t.closest && t.closest('input,textarea,[contenteditable="true"]:not(.editor-lines)'));
}
editorLines.addEventListener('touchend',e=>{
  const t=e.target;
  if(!t.closest||!t.closest('.inline-table-wrap')) return;
  if(isTypingTarget(t)) return;
  if(t.closest('button,.th-price-sort,.row-drag-handle,.row-check')) return;
  e.preventDefault();
},{passive:false});
// 안전장치: 표/버튼 영역 터치로 편집기가 포커스를 받으면 바로 해제
let _lastTouch=null,_lastTouchAt=0;
document.addEventListener('touchstart',e=>{_lastTouch=e.target;_lastTouchAt=Date.now();},{passive:true,capture:true});
editorLines.addEventListener('focus',()=>{
  if(Date.now()-_lastTouchAt>800||!_lastTouch||!_lastTouch.closest) return;
  const t=_lastTouch;
  if(t.closest('.todo-check,.todo-del') || (t.closest('.inline-table-wrap') && !isTypingTarget(t))){
    setTimeout(()=>{ if(document.activeElement===editorLines) editorLines.blur(); },0);
  }
});

function topOf(node){
  if(!node) return null;
  if(node===editorLines) return null;
  let n=node;
  while(n && n.parentNode!==editorLines){ n=n.parentNode; if(!n||n===document) return null; }
  return n;
}
function topAt(container, offset, isEnd){
  if(container===editorLines){
    const kids=editorLines.children; if(!kids.length) return null;
    const idx=isEnd?Math.max(0,offset-1):Math.min(offset,kids.length-1);
    return kids[idx];
  }
  return topOf(container);
}
function isEditorRow(el){return !!(el&&el.classList&&el.classList.contains('editor-row'));}
function clampPoint(ta, node, offset){
  try{
    const r=document.createRange();r.selectNodeContents(ta);
    if(!ta.contains(node)&&node!==ta){
      const pos=ta.compareDocumentPosition(node);
      return (pos & Node.DOCUMENT_POSITION_PRECEDING) ? [ta,0] : [ta,ta.childNodes.length];
    }
    const c=r.comparePoint(node,offset);
    if(c<0) return [ta,0];
    if(c>0) return [ta,ta.childNodes.length];
    return [node,offset];
  }catch(e){ return [ta,ta.childNodes.length]; }
}
function setCaret(node, offset){
  const r=document.createRange();r.setStart(node,offset);r.collapse(true);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
}
function cleanEmptyTa(ta){
  // 내용 없는 서식 태그(<b></b> 등) 정리
  ta.querySelectorAll('b,strong,u,i,em,span,font').forEach(el=>{ if(el.textContent===''&&!el.querySelector('img,br')) el.remove(); });
  if(ta.innerHTML==='<br>'||ta.textContent===''&&!ta.querySelector('img')) ta.innerHTML='';
}
function focusRowTa(row, ta, opts){
  if(document.activeElement!==editorLines){
    // 도구 버튼에서 부르는 경우(preventScroll): 키보드가 내려가 있으면 일부러 띄우지 않음
    if(opts&&opts.preventScroll){ activeRow=row; return; }
    editorLines.focus({preventScroll:true});
  }
  const sel=window.getSelection();
  if(sel.rangeCount){
    const r=sel.getRangeAt(0);
    try{ if(editorLines.contains(r.startContainer) && r.intersectsNode(ta)){ activeRow=row; return; } }catch(e){}
  }
  const r=document.createRange();r.selectNodeContents(ta);r.collapse(false);
  sel.removeAllRanges();sel.addRange(r);activeRow=row;
}
function getTargetRows(){
  const rows=Array.from(editorLines.children).filter(isEditorRow);
  if(allSelected) return rows;
  const sel=window.getSelection();
  if(sel&&sel.rangeCount&&!sel.isCollapsed&&editorLines.contains(sel.anchorNode)){
    const rg=sel.getRangeAt(0);
    const picked=rows.filter(r=>{
      const ta=r.querySelector('.editor-ta');
      try{
        if(!rg.intersectsNode(ta)) return false;
        // 선택 끝이 다음 줄 맨 앞에 걸친 경우는 제외
        const t=document.createRange();t.selectNodeContents(ta);
        if(rg.compareBoundaryPoints(Range.END_TO_START,t)===0 && ta.textContent!=='') return false;
        return true;
      }catch(e){return false;}
    });
    if(picked.length) return picked;
  }
  return isEditorRow(activeRow)?[activeRow]:[];
}
function selectionSpansRows(){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount||sel.isCollapsed) return false;
  const rg=sel.getRangeAt(0);
  if(!editorLines.contains(rg.commonAncestorContainer)&&rg.commonAncestorContainer!==editorLines) return false;
  const a=topAt(rg.startContainer,rg.startOffset,false), b=topAt(rg.endContainer,rg.endOffset,true);
  return !!(a&&b&&a!==b);
}
// 여러 줄에 걸친 선택 영역 삭제 → 첫 줄 앞부분 + 마지막 줄 뒷부분을 한 줄로 합침
function deleteMultiRowSelection(){
  if(!selectionSpansRows()) return false;
  const sel=window.getSelection();const rg=sel.getRangeAt(0);
  const s=topAt(rg.startContainer,rg.startOffset,false), e=topAt(rg.endContainer,rg.endOffset,true);
  saveSnapNow();
  const mids=[];let n=s.nextElementSibling;while(n&&n!==e){mids.push(n);n=n.nextElementSibling;}
  const sRow=isEditorRow(s)?s:null, eRow=isEditorRow(e)?e:null;
  let tail=null;
  if(eRow){
    const eta=eRow.querySelector('.editor-ta');
    const [en,eo]=clampPoint(eta,rg.endContainer,rg.endOffset);
    const tr=document.createRange();tr.setStart(en,eo);tr.setEnd(eta,eta.childNodes.length);
    tail=tr.extractContents();
  }
  let caretRow;
  if(sRow){
    const sta=sRow.querySelector('.editor-ta');
    const [sn,so]=clampPoint(sta,rg.startContainer,rg.startOffset);
    const hr=document.createRange();hr.setStart(sn,so);hr.setEnd(sta,sta.childNodes.length);
    hr.deleteContents();
    if(sta.innerHTML==='<br>') sta.innerHTML='';
    const off=sta.childNodes.length;
    if(tail) sta.appendChild(tail);
    mids.forEach(m=>m.remove()); e.remove();
    cleanEmptyTa(sta);
    caretRow=sRow; setCaret(sta,Math.min(off,sta.childNodes.length));
  } else if(eRow){
    const eta=eRow.querySelector('.editor-ta');
    s.remove(); mids.forEach(m=>m.remove());
    eta.innerHTML=''; if(tail) eta.appendChild(tail); cleanEmptyTa(eta);
    caretRow=eRow; setCaret(eta,0);
  } else {
    const nr=makeRow({style:'none',text:''});
    editorLines.insertBefore(nr,s);
    s.remove(); mids.forEach(m=>m.remove()); e.remove();
    caretRow=nr; setCaret(nr.querySelector('.editor-ta'),0);
  }
  if(!editorLines.children.length){const nr=makeRow({style:'none',text:''});editorLines.appendChild(nr);caretRow=nr;setCaret(nr.querySelector('.editor-ta'),0);}
  clearAllSelected();
  activeRow=caretRow;reindexNumbers();updateToolbar();scheduleAutoSave();
  return true;
}
function caretInfo(){
  const sel=window.getSelection();if(!sel||!sel.rangeCount) return null;
  const rg=sel.getRangeAt(0);
  const row=topAt(rg.startContainer,rg.startOffset,false);
  if(!isEditorRow(row)) return null;
  const ta=row.querySelector('.editor-ta');
  const [n,o]=clampPoint(ta,rg.startContainer,rg.startOffset);
  const before=document.createRange();before.setStart(ta,0);before.setEnd(n,o);
  const after=document.createRange();after.setStart(n,o);after.setEnd(ta,ta.childNodes.length);
  return {rg,row,ta,node:n,offset:o,atStart:before.toString()==='',atEnd:after.toString()===''&&!after.cloneContents().querySelector?.('img')};
}
// Enter: 커서 위치에서 줄 나누기 (뒷부분은 새 줄로)
function splitRowAtCaret(force){
  const sel=window.getSelection();
  if(sel.rangeCount&&!sel.isCollapsed){ sel.getRangeAt(0).deleteContents(); }
  const c=caretInfo();if(!c) return;
  const {row,ta}=c;
  const style=row.dataset.style||'none', todo=row.dataset.todo==='true';
  // 빈 줄에서 Enter → 목록/할일 해제 (메모 앱 방식)
  if(!force && isRowEmpty(ta) && (style!=='none'||todo)){
    row.dataset.style='none';delete row.dataset.numStart;
    if(todo){row.dataset.todo='false';row.dataset.done='false';const cb=row.querySelector('.todo-check');if(cb)cb.classList.remove('checked');const db=row.querySelector('.todo-del');if(db)db.style.display='none';}
    reindexNumbers();updateToolbar();scheduleAutoSave();return;
  }
  const tr=document.createRange();tr.setStart(c.node,c.offset);tr.setEnd(ta,ta.childNodes.length);
  const frag=tr.extractContents();
  const nr=makeRow({style,text:'',indent:parseInt(row.dataset.indent||0),todo});
  const nta=nr.querySelector('.editor-ta');
  if(ta.dataset.size) nta.dataset.size=ta.dataset.size;
  nta.appendChild(frag);cleanEmptyTa(nta);cleanEmptyTa(ta);
  row.after(nr);reindexNumbers();
  setCaret(nta,0);activeRow=nr;updateToolbar();scheduleAutoSave();
  nr.scrollIntoView({block:'nearest'});
}
// 줄 맨 앞 Backspace
function backspaceAtRowStart(row){
  const ta=row.querySelector('.editor-ta');
  const style=row.dataset.style||'none';
  if(style!=='none'){
    row.dataset.style='none';delete row.dataset.numStart;
    reindexNumbers();updateToolbar();scheduleAutoSave();return;
  }
  if(row.dataset.todo==='true'){
    row.dataset.todo='false';row.dataset.done='false';
    const cb=row.querySelector('.todo-check');if(cb)cb.classList.remove('checked');
    const db=row.querySelector('.todo-del');if(db)db.style.display='none';
    updateToolbar();scheduleAutoSave();return;
  }
  if(parseInt(row.dataset.indent||0)>0){ row.dataset.indent=String(parseInt(row.dataset.indent)-1); scheduleAutoSave(); return; }
  const prev=row.previousElementSibling;
  if(!prev) return;
  if(!isEditorRow(prev)){
    // 바로 위가 표: 빈 줄이면 줄만 지움
    if(isRowEmpty(ta) && row.nextElementSibling){ const nx=row.nextElementSibling; row.remove(); if(isEditorRow(nx)){setCaret(nx.querySelector('.editor-ta'),0);activeRow=nx;} scheduleAutoSave(); }
    return;
  }
  const pta=prev.querySelector('.editor-ta');
  cleanEmptyTa(pta);
  const off=pta.childNodes.length;
  cleanEmptyTa(ta);
  while(ta.firstChild) pta.appendChild(ta.firstChild);
  row.remove();
  setCaret(pta,off);activeRow=prev;reindexNumbers();updateToolbar();scheduleAutoSave();
}
// 줄 맨 끝 Delete(앞으로 지우기)
function deleteAtRowEnd(row){
  const next=row.nextElementSibling;
  if(!isEditorRow(next)) return;
  const ta=row.querySelector('.editor-ta'), nta=next.querySelector('.editor-ta');
  cleanEmptyTa(ta);const off=ta.childNodes.length;cleanEmptyTa(nta);
  while(nta.firstChild) ta.appendChild(nta.firstChild);
  next.remove();setCaret(ta,off);reindexNumbers();scheduleAutoSave();
}
// 혹시 브라우저 기본 동작이 구조를 깨뜨렸을 때 복구
function normalizeEditor(){
  let changed=false;
  Array.from(editorLines.childNodes).forEach(n=>{
    if(n.nodeType===1 && (n.classList.contains('editor-row')||n.classList.contains('inline-table-wrap'))) return;
    if(n.nodeType===3 && n.textContent==='' ){ n.remove(); return; }
    // 떠돌이 텍스트/요소 → 새 줄로 감싸기
    const nr=makeRow({style:'none',text:''});const nta=nr.querySelector('.editor-ta');
    editorLines.insertBefore(nr,n);nta.appendChild(n);
    if(nta.firstChild&&nta.firstChild.nodeType===1&&nta.firstChild.tagName==='DIV'&&!nta.firstChild.className){const d=nta.firstChild;while(d.firstChild)nta.insertBefore(d.firstChild,d);d.remove();}
    cleanEmptyTa(nta);changed=true;
  });
  editorLines.querySelectorAll(':scope > .editor-row').forEach(row=>{
    let ta=row.querySelector(':scope > .editor-ta');
    if(!ta){ ta=document.createElement('div');ta.className='editor-ta';ta.focus=function(o){focusRowTa(row,ta,o);};const del=row.querySelector(':scope > .todo-del');row.insertBefore(ta,del||null);changed=true; }
    // 줄 안에 ta 바깥으로 새어 나온 내용 → ta 안으로
    Array.from(row.childNodes).forEach(c=>{
      if(c===ta) return;
      if(c.nodeType===1 && (c.classList.contains('todo-check')||c.classList.contains('todo-del')||c.classList.contains('editor-gutter'))) return;
      if(c.compareDocumentPosition(ta)&Node.DOCUMENT_POSITION_FOLLOWING) ta.insertBefore(c,ta.firstChild); else ta.appendChild(c);
      changed=true;
    });
    // ta 안에 다른 줄 구조가 끼어든 경우 풀기
    ta.querySelectorAll('.todo-check,.todo-del,.editor-gutter').forEach(x=>{x.remove();changed=true;});
    ta.querySelectorAll('.editor-ta,.editor-row').forEach(x=>{while(x.firstChild)x.parentNode.insertBefore(x.firstChild,x);x.remove();changed=true;});
  });
  if(!editorLines.children.length){editorLines.appendChild(makeRow({style:'none',text:''}));changed=true;}
  if(changed) reindexNumbers();
}

const NAV_KEYS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Shift','Control','Alt','Meta','Tab','Escape','CapsLock','Home','End','PageUp','PageDown'];
editorLines.addEventListener('keydown',e=>{
  if(e.target!==editorLines) return;
  if (allSelected) {
    if (!((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a')) {
      if (e.key.length===1 && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();clearAllSelected();saveSnapNow();
        editorLines.innerHTML='';
        const row=makeRow({style:'none',text:e.key});editorLines.appendChild(row);
        const t=row.querySelector('.editor-ta');setCaret(t,t.childNodes.length);activeRow=row;scheduleAutoSave();
        return;
      } else if (e.key==='Backspace' || e.key==='Delete') {
        e.preventDefault();clearAllSelected();saveSnapNow();
        editorLines.innerHTML='';
        const row=makeRow({style:'none',text:''});editorLines.appendChild(row);
        setCaret(row.querySelector('.editor-ta'),0);activeRow=row;scheduleAutoSave();
        return;
      } else if (!NAV_KEYS.includes(e.key)) {
        clearAllSelected();
      } else { clearAllSelected(); }
    }
  }
  if(e.ctrlKey||e.metaKey||NAV_KEYS.includes(e.key)) return;
  // 한글 입력(조합) 등: 여러 줄 선택 상태에서 입력 시작 → 먼저 선택 영역을 지워 구조 보존
  if(e.key!=='Backspace'&&e.key!=='Delete'&&e.key!=='Enter'&&selectionSpansRows()) deleteMultiRowSelection();
});
editorLines.addEventListener('beforeinput',e=>{
  if(e.target!==editorLines && !(isEditorRow(topOf(e.target))) ) return;
  if(document.activeElement!==editorLines) return;
  const t=e.inputType||'';
  if(t==='insertParagraph'||t==='insertLineBreak'){
    e.preventDefault();saveSnapNow();
    deleteMultiRowSelection();splitRowAtCaret(false);return;
  }
  if(t.startsWith('delete')){
    if(deleteMultiRowSelection()){e.preventDefault();return;}
    const sel=window.getSelection();
    if(sel&&sel.isCollapsed){
      const c=caretInfo();if(!c){e.preventDefault();return;}
      if(t.includes('Backward')&&c.atStart){e.preventDefault();saveSnapNow();backspaceAtRowStart(c.row);return;}
      if(t.includes('Forward')&&c.atEnd){e.preventDefault();saveSnapNow();deleteAtRowEnd(c.row);return;}
    }
    return;
  }
  if(t.startsWith('insert')&&selectionSpansRows()){
    if(e.cancelable&&(t==='insertText'||t==='insertReplacementText')&&e.data!=null){
      e.preventDefault();deleteMultiRowSelection();document.execCommand('insertText',false,e.data);return;
    }
    deleteMultiRowSelection();
  }
});
editorLines.addEventListener('input',e=>{
  if(e.target!==editorLines) return;
  normalizeEditor();scheduleAutoSave();
});
editorLines.addEventListener('paste',e=>{
  if(document.activeElement!==editorLines) return;
  const text=(e.clipboardData&&e.clipboardData.getData('text/plain'))||'';
  e.preventDefault();if(!text) return;
  saveSnapNow();
  if(!deleteMultiRowSelection()){const sel=window.getSelection();if(sel.rangeCount&&!sel.isCollapsed)sel.getRangeAt(0).deleteContents();}
  const lines=text.replace(/\r\n?/g,'\n').split('\n');
  const multi=lines.length>1;
  lines.forEach((ln,i)=>{
    if(i>0) splitRowAtCaret(true);
    if(multi){
      const c=caretInfo();
      // 빈 줄 맨 앞에 붙는 경우에만 기호를 서식으로 복원
      if(c&&c.atStart&&isRowEmpty(c.ta)){
        if(i>0){ // 새로 생긴 줄은 이전 줄 서식을 물려받지 않고 붙여넣은 내용대로
          c.row.dataset.style='none';delete c.row.dataset.numStart;c.row.dataset.indent='0';
          c.row.dataset.todo='false';c.row.dataset.done='false';
          c.row.querySelector('.todo-check')?.classList.remove('checked');
          const db=c.row.querySelector('.todo-del');if(db)db.style.display='none';
        }
        ln=applyPastedPrefix(c.row,ln);
      }
    }
    if(ln) document.execCommand('insertText',false,ln);
  });
  reindexNumbers();updateToolbar();
  normalizeEditor();scheduleAutoSave();
});
document.addEventListener('cut',e=>{
  if(allSelected||document.activeElement!==editorLines) return;
  if(!selectionSpansRows()) return;
  e.preventDefault();
  e.clipboardData.setData('text/plain',selectionToPlainText());
  deleteMultiRowSelection();
});
// 여러 줄 복사 시 앞 기호(•, –, 1., ☐/☑)와 들여쓰기를 글자로 포함
function rowPrefix(row){
  const ind='  '.repeat(parseInt(row.dataset.indent||0));
  if(row.dataset.todo==='true') return ind+(row.dataset.done==='true'?'☑ ':'☐ ');
  const st=row.dataset.style||'none';
  if(st==='none') return ind;
  const sym=(row.querySelector('.editor-gutter')||{}).dataset?.sym||'';
  return ind+(sym?sym+' ':'');
}
function tableToText(wrap){
  const out=[];
  wrap.querySelectorAll('table > tbody').forEach(tb=>{
    const cat=(tb.dataset.category||'').trim(); if(cat) out.push('['+cat+']');
    getItemRows(tb).forEach(tr=>{
      const nm=tr.querySelector('.td-name textarea')?.value||'';
      const q=tr.querySelector('.td-qty input')?.value||'';
      const pr=rowUnit(tr)==null?'':String(rowLineTotal(tr));
      if(!nm&&!pr) return;
      let line='- '+nm; if(q&&q!=='1') line+=' x'+q; if(pr) line+=' '+formatPrice(pr);
      out.push(line);
    });
  });
  return out.join('\n');
}
function selectionToPlainText(){
  const sel=window.getSelection();if(!sel||!sel.rangeCount) return '';
  const rg=sel.getRangeAt(0);
  const a=topAt(rg.startContainer,rg.startOffset,false), b=topAt(rg.endContainer,rg.endOffset,true);
  if(!a||!b) return sel.toString();
  const lines=[];let n=a;
  while(n){
    if(isEditorRow(n)){
      const ta=n.querySelector('.editor-ta');
      const r=document.createRange();r.selectNodeContents(ta);
      if(n===a){const [sn,so]=clampPoint(ta,rg.startContainer,rg.startOffset);r.setStart(sn,so);}
      if(n===b){const [en,eo]=clampPoint(ta,rg.endContainer,rg.endOffset);r.setEnd(en,eo);}
      lines.push(rowPrefix(n)+r.toString());
    } else if(n.classList&&n.classList.contains('inline-table-wrap')){
      const t=tableToText(n); if(t) lines.push(t);
    }
    if(n===b) break; n=n.nextElementSibling;
  }
  return lines.join('\n');
}
document.addEventListener('copy',e=>{
  if(allSelected||document.activeElement!==editorLines) return;
  if(!selectionSpansRows()) return;
  e.preventDefault();
  e.clipboardData.setData('text/plain',selectionToPlainText());
});
// 붙여넣을 때 앞 기호를 다시 서식으로 복원
function applyPastedPrefix(row, line){
  let m=line.match(/^((?:  )*)(☐ |☑ |• |– |- |\d+\. )?(.*)$/s);
  if(!m) return line;
  const ind=Math.min(3,m[1].length/2), pre=m[2]||'';
  if(!pre&&!ind) return line;
  row.dataset.indent=String(ind);
  if(pre==='☐ '||pre==='☑ '){
    row.dataset.style='none';row.dataset.todo='true';
    if(pre==='☑ '){row.dataset.done='true';row.querySelector('.todo-check')?.classList.add('checked');const db=row.querySelector('.todo-del');if(db)db.style.display='flex';}
  } else if(pre){
    row.dataset.todo='false';row.dataset.done='false';
    row.dataset.style=pre==='• '?'bullet':(/^\d/.test(pre)?'number':'dash');
  } else if(ind){ /* 들여쓰기만 */ }
  return m[3];
}

document.addEventListener('selectionchange',()=>{
  if(document.activeElement!==editorLines) return;
  const sel=window.getSelection();if(!sel||!sel.rangeCount) return;
  const row=topOf(sel.focusNode)||topAt(sel.focusNode,sel.focusOffset,true);
  if(isEditorRow(row)){activeRow=row;updateToolbar();}
  const ta=isEditorRow(activeRow)?activeRow.querySelector('.editor-ta'):null;
  if(ta && editorLines.children.length>1 && isFullRowSelected(ta)) markOneRowSelected(activeRow);
  else if(oneRowSelected||allSelected) clearAllSelected();
});

// ── 인라인 표 ──────────────────────────────────────────────────────────────────
function formatPrice(val){
  const n=parseFloat(val.replace(/[^0-9.]/g,''));
  if(isNaN(n)||val.trim()==='') return val;
  return '₩' + n.toLocaleString('ko-KR');
}

const MEMO_ICON_SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><line x1="9" y1="9" x2="10" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>';

function getItemRows(tbody){
  return Array.from(tbody.querySelectorAll(':scope > tr.item-row'));
}

function attachRowDrag(handle, tr){
  let dragging=false;
  let ghost=null;
  let startClientY=0;

  const onMove=(e)=>{
    if(!dragging) return;
    const tbody=tr.closest('tbody');
    if(!tbody) return;
    const y=e.clientY;

    if(ghost){
      ghost.style.transform=`translateY(${y-startClientY}px)`;
    }

    const rows=getItemRows(tbody).filter(r=>r!==tr);
    const subtotalRow=tbody.querySelector('.subtotal-row');
    let targetNext=null;
    for(const r of rows){
      const rect=r.getBoundingClientRect();
      const mid=rect.top+rect.height/2;
      if(y<mid){ targetNext=r; break; }
    }
    const desiredNext = targetNext || subtotalRow;
    const currentNext = tr.nextElementSibling;
    if(currentNext===desiredNext) return;

    // FLIP: 이동 전 위치 기록 → DOM 재배치 → 이동한 행들만 부드럽게 슬라이드
    const others=rows;
    const firstRects=new Map();
    others.forEach(r=>{ firstRects.set(r, r.getBoundingClientRect()); });

    tbody.insertBefore(tr, desiredNext);

    others.forEach(r=>{
      const first=firstRects.get(r);
      const last=r.getBoundingClientRect();
      const delta=first.top-last.top;
      if(delta){
        r.style.transition='none';
        r.style.transform=`translateY(${delta}px)`;
        requestAnimationFrame(()=>{
          r.style.transition='transform .2s cubic-bezier(.2,.8,.2,1)';
          r.style.transform='';
        });
      }
    });
  };
  const onUp=(e)=>{
    if(!dragging) return;
    dragging=false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    tr.classList.remove('row-dragging');
    tr.style.transform='';
    if(ghost){
      ghost.style.transition='opacity .15s ease';
      ghost.style.opacity='0';
      const g=ghost;
      setTimeout(()=>g.remove(),150);
      ghost=null;
    }
    scheduleAutoSave();
  };
  handle.addEventListener('pointerdown',(e)=>{
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    e.stopPropagation();
    saveSnapNow();
    dragging=true;
    startClientY=e.clientY;

    const rect=tr.getBoundingClientRect();
    ghost=document.createElement('div');
    ghost.className='row-drag-ghost';
    ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;`;
    const nameVal=tr.querySelector('.td-name textarea')?.value || '';
    ghost.innerHTML=`<div class="row-drag-ghost-inner">${esc(nameVal)}</div>`;
    document.body.appendChild(ghost);

    tr.classList.add('row-dragging');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

function attachRowSwipeDelete(tr, tbody){
  const THRESHOLD=70;
  let startX=0,startY=0,dx=0,dragging=false,moved=false;
  const onDown=(e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    startX=e.clientX;startY=e.clientY;dx=0;moved=false;dragging=true;
    tr.style.transition='none';
  };
  const onMove=(e)=>{
    if(!dragging) return;
    const cdx=e.clientX-startX, cdy=e.clientY-startY;
    if(!moved){
      if(Math.abs(cdx)<8 && Math.abs(cdy)<8) return;
      if(Math.abs(cdy)>Math.abs(cdx)){ dragging=false; return; }
      moved=true;
    }
    dx=Math.min(0,cdx);
    tr.style.transform=`translateX(${dx}px)`;
    tr.style.background = dx<-16 ? `rgba(239,68,68,${Math.min(.85,Math.abs(dx)/120)})` : '';
  };
  const onUp=()=>{
    if(!dragging) return;
    dragging=false;
    tr.style.transition='transform .18s ease, opacity .18s ease';
    if(moved && Math.abs(dx)>THRESHOLD){
      const itemRows=getItemRows(tbody);
      if(itemRows.length<=1){
        tr.style.transform='translateX(0)';
        tr.style.background='';
      } else {
        saveSnapNow();
        tr.style.transform='translateX(-100%)';
        tr.style.opacity='0';
        setTimeout(()=>{
          tr.remove();
          updateCategoryTotal(tbody);
          scheduleAutoSave();
        },180);
        moved=false;
        return;
      }
    } else {
      tr.style.transform='translateX(0)';
      tr.style.background='';
    }
    moved=false;
  };
  tr.addEventListener('pointerdown', onDown);
  tr.addEventListener('pointermove', onMove);
  tr.addEventListener('pointerup', onUp);
  tr.addEventListener('pointercancel', onUp);
}

function rowQty(tr){ const n=parseInt(tr.querySelector('.td-qty input')?.value,10); return isNaN(n)||n<1?1:n; }
function rowUnit(tr){
  if(tr._unit!==undefined) return tr._unit;
  const v=parseFloat((tr.querySelector('.td-price input')?.value||'').replace(/[^0-9.]/g,''));
  return isNaN(v)?null:v;
}
function rowLineTotal(tr){ const u=rowUnit(tr); return u==null?0:Math.round(u*rowQty(tr)); }
function renderRowPrice(tr, keepIfFocused){
  const inp=tr.querySelector('.td-price input'); if(!inp) return;
  if(keepIfFocused && document.activeElement===inp) return;
  const u=rowUnit(tr);
  inp.value = u==null ? '' : rowLineTotal(tr).toLocaleString('ko-KR');
}
function makeTableRow(tbody){
  const tr=document.createElement('tr');tr.className='item-row';
  const tdName=document.createElement('td');tdName.className='td-name';
  const tdQty=document.createElement('td');tdQty.className='td-qty';
  const tdNote=document.createElement('td');tdNote.className='td-note';

  // 가격 칸: ₩ 기호를 왼쪽에 고정, 숫자만 입력칸
  const tdPrice=document.createElement('td');tdPrice.className='td-price';
  const priceWrap=document.createElement('div');
  priceWrap.style.cssText='display:flex;align-items:center;height:100%';
  const wonSign=document.createElement('span');
  wonSign.textContent='₩';
  wonSign.style.cssText='padding-left:3px;color:#374151;font-size:13px;flex-shrink:0;line-height:1';
  const inPrice=document.createElement('input');inPrice.type='text';inPrice.placeholder='';
  inPrice.style.cssText='flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;padding:4px 3px;text-align:center;min-width:0';
  inPrice.inputMode='numeric';
  inPrice.setAttribute('enterkeyhint','next');
  // 가격 칸은 "단가 × 수량" 금액을 보여줌. 직접 입력한 금액은 현재 수량 기준으로 단가로 환산해 기억.
  inPrice.addEventListener('input',()=>{
    inPrice.value=inPrice.value.replace(/[^0-9]/g,'');
    const v=parseFloat(inPrice.value);
    tr._unit = isNaN(v) ? null : v/rowQty(tr);
    updateCategoryTotal(tbody);
  });
  inPrice.addEventListener('focus',()=>{ inPrice.value=inPrice.value.replace(/[,]/g,''); });
  inPrice.addEventListener('blur',()=>{
    renderRowPrice(tr);
    updateCategoryTotal(tbody);
  });
  priceWrap.appendChild(wonSign);priceWrap.appendChild(inPrice);
  tdPrice.appendChild(priceWrap);

  const inName=document.createElement('textarea');inName.rows=1;inName.placeholder='';
  const autoResize=(ta)=>{ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; };
  inName.addEventListener('input',()=>autoResize(inName));

  // 왼쪽 컨트롤: 계산 포함 체크박스 + 드래그 핸들
  const nameControls=document.createElement('div');nameControls.className='td-name-controls';
  const chk=document.createElement('input');chk.type='checkbox';chk.className='row-check';chk.checked=true;chk.title='계산에 포함';
  chk.addEventListener('change',()=>{
    tr.classList.toggle('row-excluded', !chk.checked);
    updateCategoryTotal(tbody);
    scheduleAutoSave();
  });
  // 체크칸: 포커스를 가져가지 않게 해서 키보드가 뜨지 않도록 (터치는 직접 토글)
  chk.tabIndex=-1;
  chk.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();},{passive:false});
  chk.addEventListener('touchend',e=>{
    e.preventDefault();e.stopPropagation();
    const ae=document.activeElement;
    if(ae&&(ae===editorLines||ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable)) ae.blur();
    chk.checked=!chk.checked;
    chk.dispatchEvent(new Event('change',{bubbles:true}));
  },{passive:false});
  chk.addEventListener('mousedown',e=>e.preventDefault());
  const dragHandle=document.createElement('div');dragHandle.className='row-drag-handle';dragHandle.textContent='⠿';
  nameControls.appendChild(chk);nameControls.appendChild(dragHandle);

  // 수량 칸: 기본값 1, -/+ 스테퍼 버튼 + 직접 입력
  const qtyWrap=document.createElement('div');qtyWrap.className='qty-stepper';
  qtyWrap.style.cssText='display:flex;align-items:center;justify-content:space-between;height:100%;width:100%';
  const qtyMinus=document.createElement('button');qtyMinus.type='button';qtyMinus.className='qty-btn';qtyMinus.textContent='−';
  qtyMinus.style.cssText='width:15px;height:100%;border:none;background:transparent;color:#9095a0;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 15px;font-family:inherit';
  const inQty=document.createElement('input');inQty.type='text';inQty.className='qty-input';inQty.value='1';
  inQty.style.cssText='width:auto;flex:1 1 0;border:none;outline:none;background:transparent;text-align:center;font-family:inherit;font-size:13px;padding:0;min-width:0;color:#111318;height:100%';
  inQty.inputMode='numeric';
  inQty.setAttribute('enterkeyhint','next');
  const qtyPlus=document.createElement('button');qtyPlus.type='button';qtyPlus.className='qty-btn';qtyPlus.textContent='+';
  qtyPlus.style.cssText='width:15px;height:100%;border:none;background:transparent;color:#9095a0;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 15px;font-family:inherit';
  const stepQty=(d)=>{
    let n=parseInt(inQty.value,10); if(isNaN(n))n=1;
    inQty.value=String(Math.max(1,n+d));
    renderRowPrice(tr);
    updateCategoryTotal(tbody); scheduleAutoSave();
  };
  // +/− 버튼: 포커스를 가져가지 않게 해서 키보드가 뜨지 않도록
  [[qtyMinus,-1],[qtyPlus,1]].forEach(([btn,d])=>{
    btn.tabIndex=-1;
    let touched=false;
    btn.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();},{passive:false});
    btn.addEventListener('touchend',e=>{
      e.preventDefault();e.stopPropagation();touched=true;
      const ae=document.activeElement;
      if(ae&&(ae===editorLines||ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable)) ae.blur();
      stepQty(d);
      setTimeout(()=>{touched=false;},400);
    },{passive:false});
    btn.addEventListener('mousedown',e=>e.preventDefault());
    btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(touched)return;stepQty(d);});
  });
  inQty.addEventListener('input',()=>{ inQty.value=inQty.value.replace(/[^0-9]/g,''); if(parseInt(inQty.value,10)>=1){renderRowPrice(tr,true);updateCategoryTotal(tbody);} });
  inQty.addEventListener('blur',()=>{
    if(inQty.value.trim()===''||parseInt(inQty.value,10)<1) inQty.value='1';
    renderRowPrice(tr);
    updateCategoryTotal(tbody);
  });
  qtyWrap.appendChild(qtyMinus);qtyWrap.appendChild(inQty);qtyWrap.appendChild(qtyPlus);

  // 메모 칸: 아이콘 버튼 클릭 시 팝업으로 메모 입력
  const noteBtn=document.createElement('button');noteBtn.type='button';noteBtn.className='memo-btn';
  noteBtn.innerHTML=MEMO_ICON_SVG;
  const noteBg=document.createElement('div');noteBg.className='memo-bg';
  const notePopup=document.createElement('div');notePopup.className='memo-popup';
  const noteTitle=document.createElement('div');noteTitle.className='memo-title';noteTitle.textContent='메모';
  const inNote=document.createElement('textarea');inNote.rows=4;inNote.placeholder='메모 입력';
  const noteDone=document.createElement('button');noteDone.type='button';noteDone.className='memo-done';noteDone.textContent='완료';
  notePopup.appendChild(noteTitle);notePopup.appendChild(inNote);notePopup.appendChild(noteDone);
  noteBg.appendChild(notePopup);
  const closeNote=()=>{inNote.blur();noteBg.classList.remove('open');if(noteBg.parentNode)noteBg.remove();scheduleAutoSave();};
  noteBtn.addEventListener('click',(e)=>{
    e.stopPropagation();
    const nm=(inName.value||'').trim();noteTitle.textContent=nm?nm+' 메모':'메모';
    document.body.appendChild(noteBg);noteBg.classList.add('open');
    inNote.focus({preventScroll:true});
  });
  noteDone.addEventListener('click',e=>{e.stopPropagation();closeNote();});
  noteBg.addEventListener('click',e=>{e.stopPropagation();if(e.target===noteBg)closeNote();});
  inNote.addEventListener('input',()=>{
    noteBtn.classList.toggle('has-memo', inNote.value.trim()!=='');
    scheduleAutoSave();
  });
  tr._noteInput=inNote;
  tdNote.appendChild(noteBtn);

  const inputs=[inName,inQty,inPrice];

  // Enter 처리: 항상 줄바꿈 대신 아래에 새 행을 만들고 같은 열로 포커스 이동
  inputs.forEach((inp,colIdx)=>{
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const itemRows=getItemRows(tbody);
        const trIdx=itemRows.indexOf(tr);
        let nextRow;
        if(trIdx===itemRows.length-1){
          nextRow=makeTableRow(tbody);
          const subtotalRow=tbody.querySelector('.subtotal-row');
          tbody.insertBefore(nextRow, subtotalRow);
          refreshCategoryColors(tbody.closest('table'));
        } else {
          nextRow=itemRows[trIdx+1];
        }
        const nextInputs=[
          nextRow.querySelector('.td-name textarea'),
          nextRow.querySelector('.td-qty input'),
          nextRow.querySelector('.td-price input')
        ];
        // 가격 칸에서 다음(엔터)으로 넘어갈 땐 다음 행의 물품명으로 이동 (숫자키패드엔 엔터가 없어 enterkeyhint로 대체)
        const targetIdx = colIdx===2 ? 0 : colIdx;
        if(nextInputs[targetIdx]) nextInputs[targetIdx].focus();
      }
    });
  });

  // 빈 마지막 행에서 이름 칸 backspace → 행 삭제 (카테고리당 최소 1행 유지)
  inName.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&inName.value===''){
      const itemRows=getItemRows(tbody);
      if(itemRows.length>1&&tr===itemRows[itemRows.length-1]){
        e.preventDefault();
        const prevRow=itemRows[itemRows.length-2];
        tr.remove();
        if(prevRow) prevRow.querySelector('.td-name textarea').focus();
        updateCategoryTotal(tbody);
      }
    }
  });

  tdName.appendChild(nameControls);tdName.appendChild(inName);tdQty.appendChild(qtyWrap);
  tr.appendChild(tdName);tr.appendChild(tdQty);tr.appendChild(tdPrice);tr.appendChild(tdNote);
  attachRowDrag(dragHandle, tr);
  attachRowSwipeDelete(tr, tbody);
  return tr;
}

function fillItemRow(tr, itemData){
  itemData=itemData||{};
  const nameTa=tr.querySelector('.td-name textarea');
  const qtyIn=tr.querySelector('.td-qty input');
  const priceIn=tr.querySelector('.td-price input');
  const noteTa=tr._noteInput;
  const chk=tr.querySelector('.row-check');
  if(nameTa){ nameTa.value=itemData.name||''; nameTa.style.height='auto'; nameTa.style.height=nameTa.scrollHeight+'px'; }
  if(qtyIn) qtyIn.value=itemData.qty||'1';
  { const v=parseFloat(String(itemData.price||'').replace(/[^0-9.]/g,'')); tr._unit=isNaN(v)?null:v; renderRowPrice(tr); }
  if(noteTa){
    noteTa.value=itemData.note||'';
    const btn=tr.querySelector('.memo-btn');
    if(btn) btn.classList.toggle('has-memo', noteTa.value.trim()!=='');
  }
  if(chk){
    const included=itemData.included===undefined?true:!!itemData.included;
    chk.checked=included;
    tr.classList.toggle('row-excluded', !included);
  }
}

function updateSubtotalLabel(tbody){
  const name=(tbody.dataset.category||'').trim();
  const stLabel=tbody.querySelector('.subtotal-label');
  if(stLabel) stLabel.textContent=(name||'카테고리')+' 소계';
}

const CAT_COLORS=[
  '#8b93f0', // 파스텔 인디고
  '#4fc9a8', // 파스텔 에메랄드
  '#f0b054', // 파스텔 amber
  '#ef8fb8', // 파스텔 핑크
  '#6fa8ef', // 파스텔 블루
  '#45c4b9', // 파스텔 틸
  '#f0899a', // 파스텔 로즈
  '#a992ef'  // 파스텔 바이올렛
];

// ── 색상 선택기 (채도/밝기 판 + 색상 막대 + 밝기 막대) ──
function _hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return[f(5),f(3),f(1)].map(x=>Math.round(x*255));}
function _rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}return[h,mx?d/mx:0,mx];}
function _hex(rgb){return'#'+rgb.map(x=>x.toString(16).padStart(2,'0')).join('');}
function _parseColor(c){c=(c||'').trim();let m=c.match(/^#?([0-9a-f]{6})$/i);if(m){const n=parseInt(m[1],16);return[n>>16&255,n>>8&255,n&255];}m=c.match(/^#?([0-9a-f]{3})$/i);if(m){return m[1].split('').map(x=>parseInt(x+x,16));}m=c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);if(m)return[+m[1],+m[2],+m[3]];return null;}
function openColorPicker(initial,onDone){
  let [h,sat,val]=_rgb2hsv(...(_parseColor(initial)||[139,147,240]));
  const bg=document.createElement('div');bg.className='cp-bg';
  bg.innerHTML=`<div class="cp-box">
    <div class="cp-title">카테고리 색상</div>
    <div class="cp-sv"><div class="cp-knob"></div></div>
    <div class="cp-lbl"><span>색상</span></div>
    <div class="cp-hue"><div class="cp-knob"></div></div>
    <div class="cp-lbl"><span>어둡게</span><span>밝게</span></div>
    <div class="cp-light"><div class="cp-knob"></div></div>
    <div class="cp-swatches"></div>
    <div class="cp-row"><div class="cp-preview"></div><input class="cp-hex" maxlength="7" spellcheck="false" autocomplete="off"></div>
    <div class="cp-btns"><button class="cp-reset">기본색</button><button class="cp-cancel">취소</button><button class="cp-ok">확인</button></div>
  </div>`;
  document.body.appendChild(bg);
  const $=q=>bg.querySelector(q);
  const sv=$('.cp-sv'),hue=$('.cp-hue'),lt=$('.cp-light'),hex=$('.cp-hex'),pv=$('.cp-preview');
  const sw=$('.cp-swatches');
  CAT_COLORS.concat(['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#64748b','#111318']).forEach(c=>{
    const b=document.createElement('button');b.className='cp-sw';b.style.background=c;
    b.onclick=()=>{[h,sat,val]=_rgb2hsv(..._parseColor(c));draw();};sw.appendChild(b);
  });
  function draw(skipHex){
    const c=_hex(_hsv2rgb(h,sat,val));
    sv.style.backgroundColor=`hsl(${h},100%,50%)`;
    const k1=sv.querySelector('.cp-knob');k1.style.left=sat*100+'%';k1.style.top=(1-val)*100+'%';k1.style.background=c;
    const k2=hue.querySelector('.cp-knob');k2.style.left=h/360*100+'%';k2.style.background=`hsl(${h},100%,50%)`;
    lt.style.background=`linear-gradient(to right,#000,${_hex(_hsv2rgb(h,sat,1))})`;
    const k3=lt.querySelector('.cp-knob');k3.style.left=val*100+'%';k3.style.background=c;
    pv.style.background=c;if(!skipHex)hex.value=c.toUpperCase();
  }
  function drag(el,fn){
    const go=e=>{const r=el.getBoundingClientRect();fn(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)));draw();};
    el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);go(e);
      const mv=ev=>go(ev),up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});
  }
  drag(sv,(x,y)=>{sat=x;val=1-y;});
  drag(hue,x=>{h=Math.min(x*360,359.9);});
  drag(lt,x=>{val=x;});
  hex.addEventListener('input',()=>{const p=_parseColor(hex.value);if(p&&/^#?[0-9a-f]{6}$/i.test(hex.value.trim())){[h,sat,val]=_rgb2hsv(...p);draw(true);}});
  const close=()=>bg.remove();
  $('.cp-cancel').onclick=close;
  bg.addEventListener('pointerdown',e=>{if(e.target===bg)close();});
  $('.cp-reset').onclick=()=>{close();onDone('');};
  $('.cp-ok').onclick=()=>{const c=_hex(_hsv2rgb(h,sat,val));close();onDone(c);};
  draw();
}

function refreshCategoryColors(table){
  if(!table) return;
  const tbodies=Array.from(table.querySelectorAll(':scope > tbody'));
  tbodies.forEach((tb,idx)=>{
    const c=tb.dataset.color||CAT_COLORS[idx%CAT_COLORS.length];
    if(tb._labelInner) tb._labelInner.style.background=c;
    if(tb._chip) tb._chip.style.color='#fff';
    // 물품 행에 별도의 칸 없이, 왼쪽 안쪽 색상 바(box-shadow)로 카테고리 색상을 이어줌
    getItemRows(tb).forEach(r=>{
      const nameCell=r.querySelector('.td-name');
      if(nameCell) nameCell.style.boxShadow=`inset 4px 0 0 0 ${c}`;
    });
    const subLabel=tb.querySelector(':scope > tr.subtotal-row .subtotal-label');
    if(subLabel) subLabel.style.boxShadow=`inset 4px 0 0 0 ${c}`;
  });
}

function attachCategorySwipeDelete(inner, bg, onDelete){
  const THRESHOLD=64;
  let startX=0,startY=0,dx=0,dragging=false,moved=false;

  const onDown=(e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    startX=e.clientX;startY=e.clientY;dx=0;moved=false;dragging=true;
    inner.style.transition='none';
  };
  const onMove=(e)=>{
    if(!dragging) return;
    const cdx=e.clientX-startX, cdy=e.clientY-startY;
    if(!moved){
      if(Math.abs(cdx)<6 && Math.abs(cdy)<6) return;
      if(Math.abs(cdy)>Math.abs(cdx)){ dragging=false; return; }
      moved=true;
      inner.style.userSelect='none';
      inner.style.webkitUserSelect='none';
    }
    dx=Math.min(0,cdx);
    inner.style.transform=`translateX(${dx}px)`;
    bg.style.opacity=String(Math.min(1,Math.abs(dx)/THRESHOLD));
  };
  const onUp=()=>{
    if(!dragging) return;
    dragging=false;
    inner.style.transition='transform .18s ease';
    inner.style.userSelect='';
    inner.style.webkitUserSelect='';
    if(moved && Math.abs(dx)>THRESHOLD){
      inner.style.transform='translateX(-100%)';
      bg.style.opacity='1';
      setTimeout(onDelete,160);
    } else {
      inner.style.transform='translateX(0)';
      bg.style.opacity='0';
    }
    moved=false;
  };
  inner.addEventListener('pointerdown',onDown);
  inner.addEventListener('pointermove',onMove);
  inner.addEventListener('pointerup',onUp);
  inner.addEventListener('pointercancel',onUp);
  inner.addEventListener('pointerleave',(e)=>{ if(dragging && e.buttons===0) onUp(); });
}

function makeCategoryBlock(table, initialName){
  const tbody=table.createTBody();
  tbody.dataset.category=initialName||'';

  // 라벨 행: 카테고리 칩(첫 행 위에 한 번만 표시, 색 채움). 삭제는 좌측 스와이프로.
  const labelRow=tbody.insertRow();labelRow.className='category-label-row';
  const labelTd=document.createElement('td');labelTd.className='td-cat-label';labelTd.colSpan=4;

  const deleteBg=document.createElement('div');deleteBg.className='cat-delete-bg';deleteBg.textContent='삭제';
  const inner=document.createElement('div');inner.className='cat-label-inner';

  const chip=document.createElement('div');chip.className='cat-chip';
  const nameSpan=document.createElement('span');nameSpan.className='category-name-input';
  nameSpan.contentEditable='true';nameSpan.dataset.placeholder='카테고리';
  nameSpan.textContent=initialName||'';
  nameSpan.addEventListener('input',()=>{ tbody.dataset.category=nameSpan.textContent; updateSubtotalLabel(tbody); scheduleAutoSave(); });
  nameSpan.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      const nameTa=tbody.querySelector('.td-name textarea');
      if(nameTa) nameTa.focus();
    }
  });
  chip.appendChild(nameSpan);
  inner.appendChild(chip);
  // 카테고리 바를 길게 누르면(0.5초) 색상 선택기 열림 (이름 편집 중일 때는 제외)
  (function(){
    let t=null,sx=0,sy=0;
    const cancel=()=>{if(t){clearTimeout(t);t=null;}};
    inner.addEventListener('pointerdown',e=>{
      if(document.activeElement===nameSpan) return;
      sx=e.clientX;sy=e.clientY;cancel();
      t=setTimeout(()=>{
        t=null;
        if(navigator.vibrate) try{navigator.vibrate(10);}catch(_){}
        const cur=tbody.dataset.color||getComputedStyle(inner).backgroundColor;
        openColorPicker(cur,(val)=>{
          saveSnapNow();
          if(val) tbody.dataset.color=val; else delete tbody.dataset.color;
          refreshCategoryColors(table);scheduleAutoSave();
        });
      },500);
    });
    inner.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8))cancel();});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>inner.addEventListener(ev,cancel));
    inner.addEventListener('contextmenu',e=>{if(document.activeElement!==nameSpan)e.preventDefault();});
  })();
  labelTd.appendChild(deleteBg);labelTd.appendChild(inner);
  labelRow.appendChild(labelTd);
  tbody._chip=chip;tbody._labelInner=inner;

  attachCategorySwipeDelete(inner, deleteBg, ()=>{
    saveSnapNow();
    tbody.remove();
    updateGrandTotal(table);
    refreshCategoryColors(table);
    scheduleAutoSave();
  });

  const firstRow=makeTableRow(tbody);
  tbody.appendChild(firstRow);

  const subtotalRow=tbody.insertRow();subtotalRow.className='subtotal-row';
  const stLabel=document.createElement('td');stLabel.colSpan=1;stLabel.className='subtotal-label';
  const stTotalTd=document.createElement('td');stTotalTd.colSpan=3;stTotalTd.className='subtotal-total';
  const stWrap=document.createElement('div');stWrap.style.cssText='display:flex;align-items:center;justify-content:center;gap:0';
  const stWon=document.createElement('span');stWon.textContent='₩';stWon.style.cssText='font-size:12px;font-weight:600;margin-right:1px';
  const stAmt=document.createElement('span');stAmt.className='subtotal-amount';stAmt.textContent='0';
  stWrap.appendChild(stWon);stWrap.appendChild(stAmt);
  stTotalTd.appendChild(stWrap);
  subtotalRow.appendChild(stLabel);subtotalRow.appendChild(stTotalTd);

  updateSubtotalLabel(tbody);
  return tbody;
}

function createTableTfoot(table){
  const tfoot=table.createTFoot();
  const footRow=tfoot.insertRow();
  const tdLabel=document.createElement('td');tdLabel.className='tfoot-label';tdLabel.colSpan=1;tdLabel.textContent='전체 합계';
  const tdTotal=document.createElement('td');tdTotal.className='tfoot-total';tdTotal.colSpan=3;
  const tdTotalWrap=document.createElement('div');
  tdTotalWrap.style.cssText='display:flex;align-items:center;justify-content:center;gap:0';
  const wonSpan=document.createElement('span');wonSpan.textContent='₩';wonSpan.style.cssText='font-size:13px;font-weight:600;margin-right:2px';
  tdTotalWrap.appendChild(wonSpan);
  const amtSpan=document.createElement('span');amtSpan.className='grand-total-amount';amtSpan.textContent='0';
  tdTotalWrap.appendChild(amtSpan);
  tdTotal.appendChild(tdTotalWrap);
  footRow.appendChild(tdLabel);footRow.appendChild(tdTotal);
  return tfoot;
}

function attachAddCategoryButton(wrap, table, tfoot){
  const addCatBtn=document.createElement('button');addCatBtn.type='button';addCatBtn.className='add-category-btn';
  addCatBtn.innerHTML='<span style="font-size:14px;line-height:1">+</span>Category';
  addCatBtn.addEventListener('click',()=>{
    const newTbody=makeCategoryBlock(table,'');
    table.insertBefore(newTbody, tfoot);
    updateGrandTotal(table);
    refreshCategoryColors(table);
    const catInput=newTbody.querySelector('.category-name-input');
    if(catInput) catInput.focus();
    scheduleAutoSave();
  });
  wrap.appendChild(addCatBtn);
}

function snapshotOriginalOrder(table){
  Array.from(table.querySelectorAll(':scope > tbody')).forEach(tb=>{
    tb._origOrder=getItemRows(tb).slice();
  });
}
function restoreOriginalOrder(table){
  Array.from(table.querySelectorAll(':scope > tbody')).forEach(tb=>{
    if(!tb._origOrder) return;
    const subtotalRow=tb.querySelector('.subtotal-row');
    tb._origOrder.forEach(r=>{ if(document.contains(r)) tb.insertBefore(r, subtotalRow); });
  });
}
function applyPriceSort(table, direction){
  Array.from(table.querySelectorAll(':scope > tbody')).forEach(tb=>{
    const subtotalRow=tb.querySelector('.subtotal-row');
    const rows=getItemRows(tb);
    const priceOf=r=>{
      const inp=r.querySelector('.td-price input');
      return parseFloat((inp?inp.value:'').replace(/[^0-9.]/g,''))||0;
    };
    const sorted=rows.slice().sort((a,b)=> direction==='asc' ? priceOf(a)-priceOf(b) : priceOf(b)-priceOf(a));
    sorted.forEach(r=>tb.insertBefore(r, subtotalRow));
  });
}
function cyclePriceSort(table, th){
  const cur=table.dataset.priceSort||'none';
  let next;
  if(cur==='none'){ next='asc'; snapshotOriginalOrder(table); }
  else if(cur==='asc'){ next='desc'; }
  else { next='none'; }
  table.dataset.priceSort=next;
  if(next==='none') restoreOriginalOrder(table);
  else applyPriceSort(table, next);
  const icon=th.querySelector('.sort-icon');
  if(icon) icon.textContent = next==='asc' ? '▲' : next==='desc' ? '▼' : '⇅';
  th.classList.toggle('active', next!=='none');
  scheduleAutoSave();
}

function updateCategoryTotal(tbody){
  let total=0;
  getItemRows(tbody).forEach(tr=>{
    const priceInput=tr.querySelector('.td-price input');
    const qtyInput=tr.querySelector('.td-qty input');
    const chkInput=tr.querySelector('.row-check');
    if(!priceInput) return;
    if(chkInput && !chkInput.checked) return;
    total+=rowLineTotal(tr);
  });
  const subtotalAmt=tbody.querySelector('.subtotal-amount');
  if(subtotalAmt) subtotalAmt.textContent=total.toLocaleString('ko-KR');
  updateGrandTotal(tbody.closest('table'));
}

function updateGrandTotal(table){
  if(!table) return;
  let grand=0;
  table.querySelectorAll('tbody').forEach(tb=>{
    getItemRows(tb).forEach(tr=>{
      const priceInput=tr.querySelector('.td-price input');
      const qtyInput=tr.querySelector('.td-qty input');
      const chkInput=tr.querySelector('.row-check');
      if(!priceInput) return;
      if(chkInput && !chkInput.checked) return;
      grand+=rowLineTotal(tr);
    });
  });
  const tfootAmt=table.querySelector('.grand-total-amount');
  if(tfootAmt) tfootAmt.textContent=grand.toLocaleString('ko-KR');
}

function insertTable(){
  // editor-lines 끝에 카테고리별 표 블록 삽입
  const wrap=document.createElement('div');wrap.className='inline-table-wrap';wrap.contentEditable='false';

  const table=document.createElement('table');table.className='inline-table';

  const colgroup=document.createElement('colgroup');
  ['col-name','col-qty','col-price','col-note'].forEach(c=>{
    const col=document.createElement('col');col.className=c;colgroup.appendChild(col);
  });
  table.appendChild(colgroup);

  const thead=table.createTHead();
  const hr=thead.insertRow();
  ['물품명','수량','가격','메모'].forEach(t=>{
    const th=document.createElement('th');
    if(t==='가격'){
      th.className='th-price-sort';
      th.innerHTML='가격<span class="sort-icon">⇅</span>';
      th.addEventListener('click',()=>cyclePriceSort(table, th));
    } else {
      th.textContent=t;
    }
    hr.appendChild(th);
  });

  const tbody=makeCategoryBlock(table,'');
  refreshCategoryColors(table);
  const tfoot=createTableTfoot(table);

  wrap.appendChild(table);
  attachAddCategoryButton(wrap, table, tfoot);

  // 현재 activeRow 다음에 삽입 (없으면 맨 끝)
  if(activeRow&&activeRow.parentNode===editorLines){
    activeRow.after(wrap);
  } else {
    editorLines.appendChild(wrap);
  }
  const catInput=tbody.querySelector('.category-name-input');
  if(catInput) catInput.focus();
  scheduleAutoSave();
}

document.getElementById('tb-table')?.addEventListener('click', insertTable);

render();
</script>
